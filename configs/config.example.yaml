# Strict, reproducible configuration for one dataset.
# Copy this file, review every field against the real source, then pass it with
# `--config configs/your-reviewed-config.yaml` to validate/split/train.

# Identifier recorded in reports and artifact metadata. Change it with the dataset.
dataset_id: synthetic-demo

# License of the DATA (not of this code). "synthetic" while the fixture is used.
source_license: synthetic

# true only while the data is generated, never for a real collected source.
synthetic: true

# Seed for the deterministic grouped split. Change deliberately, not casually.
seed: 42

# Source column -> canonical field mapping. Only mapped columns are read.
columns:
  ticket_id: ticket_id
  ticket_text: ticket_text
  category: category
  priority: null # set when a genuine priority label column exists
  created_at: null # retained metadata only; not a feature

# Explicit allowlist for category labels. Empty means "accept any non-empty label".
category_labels:
  - Account Access
  - Billing
  - Technical Issue

# Priority stays disabled until genuine labels and review are supplied.
priority_enabled: false
priority_labels: []
priority_labels_verified: false

# Contract limits.
max_text_chars: 10000
min_groups_per_class: 5

# Deterministic 60/20/20 grouped split fractions (must sum to 1.0).
splits:
  train: 0.6
  validation: 0.2
  test: 0.2

# Conservative review policy. Threshold is an operational demonstration only.
review:
  always_review: true
  review_threshold: 0.7

normalization:
  lowercase: true
  mask_identifiers: true

features:
  word_ngram_range: [1, 2]
  char_ngram_range: [3, 5]
  max_features: 20000
