[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket"
version = "0.1.0"
description = "CPU-only support ticket categorization with optional priority classification and a human-review policy"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "numpy>=1.26",
    "scikit-learn>=1.5,<1.7",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "matplotlib>=3.8,<4",
    "ruff>=0.6,<1",
    "build>=1.2,<2",
    "setuptools>=68",
    "wheel",
]

[project.scripts]
support-ticket = "support_ticket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_ticket = ["api/logging.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
